name: secret-check
on:
  push:
    branches-ignore:
      - main
jobs:
  myjob:
    runs-on: ubuntu-latest
    steps:
      - name: mystep
        env:
          APP_TOKEN: ${{ secrets.APP_TOKEN  }}
        run: |
          if [ -n "$APP_TOKEN" ]; then
            echo "value is set"
          else
            exit 1
          fi
        
          
