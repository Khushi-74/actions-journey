name: context
on:
  push:
    branches-ignore:
      - main
jobs:
  myjob:
    runs-on: ubuntu-latest
    steps:
      - name: show dets
        run: |
          echo "Repository Name: ${{ github.repository }}"
          echo "Branch Name: ${{ github.ref_name }}"
          echo "Commit ID: ${{ github.sha }}"
          echo "Event Name: ${{ github.event_name }}"
          echo "Runner OS: ${{ runner.os }}"
